<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Team Rankings</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Inter, Arial, sans-serif;
      }

      body {
        background: #f4f6fb;
        margin: 0;
        padding: 40px;
        color: #222;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 36px;
        color: #1f2937;
      }

      .container {
        max-width: 1100px;
        margin: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      thead {
        background: #2563eb;
        color: white;
      }

      th {
        padding: 16px;
        text-align: left;
        font-size: 15px;
      }

      td {
        padding: 14px 16px;
        border-bottom: 1px solid #eee;
      }

      tbody tr:hover {
        background: #f1f5ff;
      }

      .rank {
        font-weight: bold;
        color: #2563eb;
      }

      .team {
        font-weight: 600;
      }

      .wins {
        color: #16a34a;
        font-weight: bold;
      }

      .points {
        color: #7c3aed;
        font-weight: bold;
      }

      .top {
        background: #fff7ed;
      }

      .nav-buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
      }

      .nav-buttons button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 5px 15px rgba(37, 99, 235, 0.25);
      }

      .nav-buttons button:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }

      .nav-buttons button:active {
        transform: translateY(0);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="nav-buttons">
        <button onclick="window.location.href = 'matches.html'">Matches</button>

        <button onclick="window.location.href = 'team.html'">Teams</button>
      </div>

      <h1>Team Rankings</h1>

      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Win Score</th>
            <th>Average Points</th>
            <th>Matches Counted</th>
          </tr>
        </thead>

        <tbody id="rankings"></tbody>
      </table>
    </div>

    <script>
      async function loadMatches() {
        const response = await fetch("matches.json");
        const matches = await response.json();

        let teams = {};

        function addTeam(team, win, score) {
          if (!teams[team]) {
            teams[team] = {
              winScore: 0,
              scores: [],
            };
          }

          teams[team].winScore += win;
          teams[team].scores.push(score);
        }

        matches.forEach((match) => {
          let played = match.redScore !== -1;

          let redTeams = [match.red1, match.red2, match.red3];

          let blueTeams = [match.blue1, match.blue2, match.blue3];

          if (played) {
            let redWin = 0;
            let blueWin = 0;

            if (match.redScore > match.blueScore) {
              redWin = 1;
            } else if (match.redScore < match.blueScore) {
              blueWin = 1;
            } else {
              redWin = 0.5;
              blueWin = 0.5;
            }

            redTeams.forEach((team) => addTeam(team, redWin, match.redScore));

            blueTeams.forEach((team) =>
              addTeam(team, blueWin, match.blueScore),
            );
          } else {
            let probability;

            /*
                winPercentage represents the probability
                that winningAlliance wins
            */

            probability = match.winPercentage / 100;

            let redWin;
            let blueWin;

            if (match.winningAlliance === "red") {
              redWin = probability;
              blueWin = 1 - probability;
            } else {
              blueWin = probability;
              redWin = 1 - probability;
            }

            redTeams.forEach((team) =>
              addTeam(team, redWin, match.redScorePred),
            );

            blueTeams.forEach((team) =>
              addTeam(team, blueWin, match.blueScorePred),
            );
          }
        });

        let rankings = Object.entries(teams).map(([team, data]) => {
          let avg = data.scores.reduce((a, b) => a + b, 0) / data.scores.length;

          return {
            team,
            winScore: data.winScore,
            averagePoints: avg,
            matches: data.scores.length,
          };
        });

        rankings.sort((a, b) => {
          if (b.winScore !== a.winScore) return b.winScore - a.winScore;

          return b.averagePoints - a.averagePoints;
        });

        let tbody = document.getElementById("rankings");

        rankings.forEach((team, index) => {
          let row = document.createElement("tr");

          if (index < 3) row.classList.add("top");

          row.innerHTML = `
            <td class="rank">${index + 1}</td>
            <td class="team">${team.team}</td>
            <td class="wins">${team.winScore.toFixed(3)}</td>
            <td class="points">${team.averagePoints.toFixed(2)}</td>
            <td>${team.matches}</td>
        `;

          tbody.appendChild(row);
        });
      }

      loadMatches();
    </script>
  </body>
</html>
